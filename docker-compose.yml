services:
  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    # El Dockerfile define un CMD "de producción" sin --reload. En desarrollo
    # montamos ./chatbot:/app abajo, así que reactivamos --reload acá.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--forwarded-allow-ips="]
    ports:
      - "8001:8001"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
    volumes:
      - ./chatbot:/app
      - ./chatbot/data:/app/data
