services:
  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    # El Dockerfile ahora define un CMD "de producción" sin --reload (para que
    # la imagen funcione sola, sin bind mount). En desarrollo seguimos
    # montando ./chatbot:/app abajo, así que reactivamos --reload acá para
    # mantener el hot-reload de siempre.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--forwarded-allow-ips="]
    ports:
      - "8001:8001"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
    volumes:
      - ./chatbot:/app
      - ./chatbot/data:/app/data
